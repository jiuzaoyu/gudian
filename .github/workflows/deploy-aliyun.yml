# 阿里云 OSS 自动部署（需在 GitHub Secrets 中配置密钥后启用）
# Settings → Secrets: ALIYUN_ACCESS_KEY_ID, ALIYUN_ACCESS_KEY_SECRET,
#   ALIYUN_OSS_BUCKET, ALIYUN_OSS_ENDPOINT, HUGO_BASEURL

name: Deploy to Aliyun OSS

on:
  workflow_dispatch:
  # 配置好 Secrets 后，可取消下面注释以实现 push 自动部署
  # push:
  #   branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: false

      - name: Build
        run: hugo --minify --baseURL "${{ secrets.HUGO_BASEURL }}"

      - name: Setup ossutil
        run: |
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -q ossutil.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil
          echo "$(pwd)/ossutil-v1.7.18-linux-amd64" >> $GITHUB_PATH

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          ossutil config -e "${{ secrets.ALIYUN_OSS_ENDPOINT }}" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH
          ossutil cp -r public/ "oss://${{ secrets.ALIYUN_OSS_BUCKET }}/" --update --force

      # 可选：安装 aliyun CLI 后刷新 CDN，需额外 Secret ALIYUN_CDN_DOMAIN
